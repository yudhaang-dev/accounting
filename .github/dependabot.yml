version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    # vite-plus needs its own vite build (TODO D1d): leave it until the toolchain migration.
    ignore:
      - dependency-name: "vite-plus"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
