name: audit

# Advisories appear without any push, so the audit steps in `tests` alone are not enough.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit JS dependencies (production, high and above)
        run: pnpm audit --prod --audit-level high

      - name: Audit JS dependencies (all, critical only)
        run: pnpm audit --audit-level critical
