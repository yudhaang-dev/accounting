name: tests

on:
  push:
    branches:
      - main
    # Documentation alone cannot break a test, except the two files the tests read.
    # Later patterns win, so the exceptions come last.
    paths:
      - '**'
      - '!**/*.md'
      - '.docs/API-CONTRACT.md'
      - '.docs/CHART-OF-ACCOUNTS.md'
  pull_request:

# A newer push makes the run of an older one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: accounting_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      LARAVEL_BYPASS_ENV_CHECK: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Setup Application
        run: composer setup

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit JS dependencies (production, high and above)
        run: pnpm audit --prod --audit-level high

      - name: Audit JS dependencies (all, critical only)
        run: pnpm audit --audit-level critical

      - name: Check generated API client types are up to date
        run: |
          pnpm run api:types
          git diff --exit-code -- resources/js/api/schema.d.ts

      - name: Run CI Checks
        run: composer ci:check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm run e2e

  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (full history, so earlier commits are scanned too)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
